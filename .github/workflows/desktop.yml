name: Desktop builds

# Windows installer and macOS disk images (Apple Silicon and Intel), each
# with the backend frozen by PyInstaller. Runs on version tags (and then
# publishes a GitHub release), on demand, and on pull requests that touch
# the packaging.
#
# Signing: the builds are unsigned unless these repository secrets exist:
#   macOS:   MAC_CERT_P12 (base64 Developer ID Application certificate),
#            MAC_CERT_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD,
#            APPLE_TEAM_ID (notarization)
#   Windows: WIN_CERT_P12 (base64 code-signing certificate), WIN_CERT_PASSWORD

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
  pull_request:
    branches: [ main, master ]
    paths:
      - 'desktop-app/**'
      - 'backend/kestrova_server.py'
      - 'backend/kestrova-server.spec'
      - 'backend/requirements.txt'
      - '.github/workflows/desktop.yml'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win --x64
          - os: macos-15
            target: --mac --arm64
          - os: macos-15-intel
            target: --mac --x64
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Build the web interface
      run: |
        cd frontend
        npm ci
        npm run build

    - name: Freeze the backend
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt pyinstaller
        pyinstaller --noconfirm --clean kestrova-server.spec

    - name: Smoke-test the frozen backend
      shell: bash
      run: |
        cd backend/dist/kestrova-server
        exe=./kestrova-server; [ -f kestrova-server.exe ] && exe=./kestrova-server.exe
        "$exe" --port 0 > "$RUNNER_TEMP/server.log" 2>&1 &
        for i in $(seq 1 180); do grep -q KESTROVA_PORT "$RUNNER_TEMP/server.log" && break; sleep 1; done
        cat "$RUNNER_TEMP/server.log"
        port=$(grep -o 'KESTROVA_PORT=[0-9]*' "$RUNNER_TEMP/server.log" | cut -d= -f2)
        curl -fsS "http://127.0.0.1:$port/api/health"
        curl -fsS -o /dev/null "http://127.0.0.1:$port/"
        kill %1 || true

    - name: Package the desktop app
      shell: bash
      env:
        CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CERT_P12 || secrets.WIN_CERT_P12 }}
        CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CERT_PASSWORD || secrets.WIN_CERT_PASSWORD }}
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      run: |
        cd desktop-app
        npm ci
        # without a certificate, build unsigned instead of searching the keychain
        if [ -z "$CSC_LINK" ]; then export CSC_IDENTITY_AUTO_DISCOVERY=false; unset CSC_LINK CSC_KEY_PASSWORD; fi
        if [ -z "$APPLE_ID" ]; then unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; fi
        npx electron-builder ${{ matrix.target }} --publish=never

    - uses: actions/upload-artifact@v4
      with:
        name: kestrova-${{ matrix.os }}
        path: |
          desktop-app/dist-electron/*.exe
          desktop-app/dist-electron/*.dmg
          desktop-app/dist-electron/*.zip
        if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: true

    - uses: softprops/action-gh-release@v2
      with:
        files: artifacts/*
        generate_release_notes: true
