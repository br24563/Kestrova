name: Desktop builds

# Windows installer and macOS disk images (Apple Silicon and Intel), each
# with the backend frozen by PyInstaller. Runs on version tags (and then
# publishes a GitHub release), on demand, and on pull requests that touch
# the packaging.
#
# Signing: the builds are unsigned unless these repository secrets exist:
#   macOS:   MAC_CERT_P12 (base64 Developer ID Application certificate),
#            MAC_CERT_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD,
#            APPLE_TEAM_ID (notarization)
#   Windows, either
#            Azure Trusted Signing: AZURE_TENANT_ID, AZURE_CLIENT_ID,
#            AZURE_CLIENT_SECRET, AZURE_SIGNING_ENDPOINT,
#            AZURE_SIGNING_ACCOUNT, AZURE_SIGNING_PROFILE,
#            AZURE_SIGNING_PUBLISHER (the certificate's subject CN)
#   or       WIN_CERT_P12 (base64 code-signing certificate), WIN_CERT_PASSWORD
# Signed builds are verified (signtool / codesign, Gatekeeper) before they
# are uploaded.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
  pull_request:
    branches: [ main, master ]
    paths:
      - 'desktop-app/**'
      - 'backend/kestrova_server.py'
      - 'backend/kestrova-server.spec'
      - 'backend/requirements.txt'
      - '.github/workflows/desktop.yml'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win --x64
          - os: macos-15
            target: --mac --arm64
          - os: macos-15-intel
            target: --mac --x64
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Build the web interface
      run: |
        cd frontend
        npm ci
        npm run build

    - name: Freeze the backend
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt pyinstaller
        pyinstaller --noconfirm --clean kestrova-server.spec

    - name: Smoke-test the frozen backend
      shell: bash
      run: |
        cd backend/dist/kestrova-server
        exe=./kestrova-server; [ -f kestrova-server.exe ] && exe=./kestrova-server.exe
        "$exe" --port 0 > "$RUNNER_TEMP/server.log" 2>&1 &
        for i in $(seq 1 180); do grep -q KESTROVA_PORT "$RUNNER_TEMP/server.log" && break; sleep 1; done
        cat "$RUNNER_TEMP/server.log"
        port=$(grep -o 'KESTROVA_PORT=[0-9]*' "$RUNNER_TEMP/server.log" | cut -d= -f2)
        curl -fsS "http://127.0.0.1:$port/api/health"
        curl -fsS -o /dev/null "http://127.0.0.1:$port/"
        kill %1 || true

    - name: Package the desktop app
      shell: bash
      env:
        CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CERT_P12 || secrets.WIN_CERT_P12 }}
        CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CERT_PASSWORD || secrets.WIN_CERT_PASSWORD }}
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
        AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
        AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
        AZURE_SIGNING_PUBLISHER: ${{ secrets.AZURE_SIGNING_PUBLISHER }}
      run: |
        cd desktop-app
        npm ci
        extra=()
        if [ "$RUNNER_OS" = "Windows" ] && [ -n "$AZURE_SIGNING_ENDPOINT" ]; then
          # Azure Trusted Signing takes precedence over a certificate file
          unset CSC_LINK CSC_KEY_PASSWORD
          extra+=("-c.win.azureSignOptions.endpoint=$AZURE_SIGNING_ENDPOINT"
                  "-c.win.azureSignOptions.codeSigningAccountName=$AZURE_SIGNING_ACCOUNT"
                  "-c.win.azureSignOptions.certificateProfileName=$AZURE_SIGNING_PROFILE"
                  "-c.win.azureSignOptions.publisherName=$AZURE_SIGNING_PUBLISHER")
          echo "SIGNED=1" >> "$GITHUB_ENV"
        elif [ -n "$CSC_LINK" ]; then
          echo "SIGNED=1" >> "$GITHUB_ENV"
        else
          # without a certificate, build unsigned instead of searching the keychain
          export CSC_IDENTITY_AUTO_DISCOVERY=false; unset CSC_LINK CSC_KEY_PASSWORD
        fi
        if [ -z "$APPLE_ID" ]; then unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; fi
        npx electron-builder ${{ matrix.target }} --publish=never "${extra[@]}"

    - name: Verify the signatures
      if: env.SIGNED == '1'
      shell: bash
      run: |
        cd desktop-app/dist-electron
        if [ "$RUNNER_OS" = "Windows" ]; then
          signtool=$(ls "/c/Program Files (x86)/Windows Kits/10/bin/"*/x64/signtool.exe | tail -1)
          for f in *.exe win-unpacked/Kestrova.exe win-unpacked/resources/backend/kestrova-server/kestrova-server.exe; do
            "$signtool" verify //pa //v "$f"
          done
        else
          app=$(ls -d mac*/Kestrova.app | head -1)
          codesign --verify --deep --strict --verbose=2 "$app"
          if [ -n "$APPLE_ID_SET" ]; then spctl --assess --type execute --verbose "$app"; fi
        fi
      env:
        APPLE_ID_SET: ${{ secrets.APPLE_ID != '' }}

    - name: Checksums
      shell: bash
      run: |
        cd desktop-app/dist-electron
        for f in *.exe *.dmg *.zip; do
          [ -f "$f" ] || continue
          if command -v sha256sum >/dev/null; then sha256sum "$f"; else shasum -a 256 "$f"; fi > "$f.sha256"
        done

    - uses: actions/upload-artifact@v4
      with:
        name: kestrova-${{ matrix.os }}
        path: |
          desktop-app/dist-electron/*.exe
          desktop-app/dist-electron/*.dmg
          desktop-app/dist-electron/*.zip
          desktop-app/dist-electron/*.sha256
        if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: true

    - uses: softprops/action-gh-release@v3
      with:
        files: artifacts/*
        generate_release_notes: true
