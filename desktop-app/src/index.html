<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; img-src 'self'" />
  <title>Kestrova</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    .loading { text-align: center; }
    .loading img { width: 96px; height: 96px; }
    .title { font-size: 28px; font-weight: 600; margin-top: 16px; }
    .status { font-size: 14px; color: #94a3b8; margin-top: 8px; }
    .bar {
      width: 200px; height: 4px; margin: 20px auto 0; overflow: hidden;
      background: rgba(255, 255, 255, 0.1); border-radius: 2px;
    }
    .bar div {
      width: 40%; height: 100%; background: #fbbf24; border-radius: 2px;
      animation: slide 1.4s ease-in-out infinite;
    }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  </style>
</head>
<body>
  <div class="loading">
    <img src="../assets/icon.png" alt="" />
    <div class="title">Kestrova</div>
    <div class="status">Starting the optics engine…</div>
    <div class="bar"><div></div></div>
  </div>
</body>
</html>
